<!DOCTYPE html>
<html lang="en"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:th="http://www.thymeleaf.org">

<head th:fragment="headerelement(pageTitle)">
    <meta charset="UTF-8" content="width=device-width, initial-scale=1.0"
          name="viewport">

    <!-- Bootstrap -->
    <link crossorigin="anonymous"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}" type="text/css">

    <title th:text="${pageTitle ?: 'NudiCentral'}"></title>

</head>


<div th:fragment="navbar">
    <nav class="navbar navbar-expand-lg border-bottom border-body m-3">
        <div class="container-fluid">
            <!-- Brand -->
            <a class="navbar-brand" href="/home">NudiCentral</a>

            <!-- Hamburger button -->
            <button aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation"
                    class="navbar-toggler"
                    data-bs-target="#navbarNav" data-bs-toggle="collapse" type="button">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Collapsible menu -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a th:class="${currentUrl == '/home' || currentUrl == '/'} ? 'nav-link active' : 'nav-link'"
                           th:href="@{/home}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a th:class="${currentUrl == '/nudi-overview'} ? 'nav-link active' : 'nav-link'"
                           th:href="@{/nudi-overview}">Nudi Overzicht</a>
                    </li>
                    <li class="nav-item">
                        <a th:class="| nav-link ${currentUrl.contains('nudi-details')? 'nav-link active' : ''}| "
                           th:href="@{/nudi-details/1}">Nudi Details</a>
                    </li>

                    <li class="nav-item">
                        <a th:class="| nav-link ${currentUrl.contains('diet-overview')? 'nav-link active' : ''}| "
                           th:href="@{/diet-overview}">Dieet Overzicht</a>
                    </li>
                    <li class="nav-item">
                        <a th:class="| nav-link ${currentUrl.contains('diet-details')? 'nav-link active' : ''}| "
                           th:href="@{/diet-details/1}">Dieet Details</a>
                    </li>

                    <li class="nav-item">
                        <a th:class="| nav-link ${currentUrl.contains('friend-overview')? 'nav-link active' : ''}| "
                           th:href="@{/friend-overview}">Vrienden Overzicht</a>
                    </li>
                    <li class="nav-item">
                        <a th:class="| nav-link ${currentUrl.contains('friend-details')? 'nav-link active' : ''}| "
                           th:href="@{/friend-details/1}">
                            Vrienden Details
                        </a>
                    </li>
                    <li class="nav-item">
                        <a th:class="| nav-link ${currentUrl.contains('sightings-overview')? 'nav-link active' : ''}|"
                           th:href="@{/sightings-overview}">Waarnemingen Overzicht
                        </a>
                    </li>
                    <li class="nav-item">
                        <a th:class="${currentUrl == '/sightings'} ? 'nav-link active' : 'nav-link'"
                           th:href="@{/sightings}"> Waarnemingen Kaart</a>
                    </li>
                    <!-- Login -->
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a th:class="|nav-link ${currentUrl.contains('login') ? 'active' : ''}|"
                           th:href="@{/login}">
                            Login
                        </a>
                    </li>

                    <!-- Register -->
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a th:class="|nav-link ${currentUrl.contains('register') ? 'active' : ''}|"
                           th:href="@{/register}">
                            Register
                        </a>
                    </li>

                    <!-- Logout -->
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a th:class="|nav-link ${currentUrl.contains('logout') ? 'active' : ''}|"
                           th:href="@{/logout}">
                            Logout
                        </a>
                    </li>
                </ul>
                <div class="nav-item" sec:authorize="isAuthenticated()">
                    <span>Ingelogd als : </span>
                    <span sec:authentication="name"></span></div>
            </div>
        </div>
    </nav>
</div>
