<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.w3.org/1999/xhtml">
<head th:replace="~{fragments/header :: headerelement(${pageTitle})}"></head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>
<main class="container-fluid overview-page">
    <h1>Vrienden</h1>
    <!--DEBUG-->
   <!--     <p sec:authorize="isAuthenticated()">
            Logged in as: <span sec:authentication="name"></span> |
            Roles: <span sec:authentication="principal.authorities"></span>
        </p>-->
    <div class="d-flex mb-3">
        <button class="btn btn-primary mb-3 " data-bs-target="#filterModal" data-bs-toggle="modal">Filter vrienden
        </button>
        <div class="col text-end">
            <a class="btn btn-outline-danger" th:href="@{/admin/friend-new}"
               sec:authorize="hasRole('ADMIN')">Admin nieuwe vriend aanmaken</a>
        </div>

    </div>
    <!-- Filter Modal -->
    <div aria-hidden="true" aria-labelledby="filterModalLabel" class="modal fade" data-bs-backdrop="static" data-bs-keyboard="false"
         id="filterModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

                <!-- Modal Header -->
                <div class="modal-header">
                    <h5 class="modal-title" id="filterModalLabel">Vrienden Filter</h5>
                    <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
                </div>

                <!-- Modal Body -->
                <div class="modal-body">
                    <form method="get" th:action="@{/friend-overview}">

                        <!--Friendname-->
                        <div class="mb-3">
                            <label class="form-label" for="friendName">User Name</label>
                            <input class="form-control" id="friendName" name="friendName" placeholder="Filter op naam..."
                                   th:value="${param.friendName}" type="text">
                        </div>
                        <!--FriendEmail -->
                        <div class="mb-3">
                            <label class="form-label" for="friendEmail">Email</label>
                            <input
                                    class="form-control"
                                    id="friendEmail"
                                    name="friendEmail"
                                    placeholder="Filter op email..."
                                    th:value="${param.friendEmail}"
                                    type="text">
                        </div>


                        <!-- Submit -->
                        <button class="btn btn-primary float-end" type="submit">Filter</button>
                    </form>
                </div>

            </div>
        </div>
    </div>
    <!-- End Filter Modal -->
    <div class="col-12" th:text="|${friends.size()} vrienden gevonden|"></div>


    <div class="d-flex flex-wrap justify-content-center">
        <div class="card" th:each="friend : ${friends}">
            <div class="card-body">
                <h5 class="card-title" th:text="${friend.friendName}"></h5>

                <img class="img-thumbnail" th:src="@{${friend.fullImgUrl}}">
                <a class="btn btn-outline-info mt-2" th:href="@{/friend-details/{id}(id=${friend.friendId})}">Details</a>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
