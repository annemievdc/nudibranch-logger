<!DOCTYPE html>
<html lang="en">
<head th:replace="~{fragments/header :: headerelement(pageTitle)}"></head>
<body class="details-page">
<div th:replace="~{fragments/header :: navbar}"></div>
<main class="container-fluid" th:if="${friend}" th:object="${friend}">
    <h2 class="text-center display-4 mb-4 text-info">Maak een nieuwe vriend aan</h2>
    <div class="row justify-content-center">
        <div class="col-12 bg-danger text-white mb-2"
             th:if="${#fields.hasAnyErrors()}">
            ERROR - data not saved
        </div>
        <form method="post" th:action="@{/admin/friend-new}" th:object="${friend}">
            <div class="row mb-3">
                <div class="col">
                    <label class="form-label text-white" for="friendName">Naam</label>
                    <input class="form-control bg-secondary text-white border-info" id="friendName"
                           th:field="*{friendName}" type="text">
                    <div class="text-danger" th:errors="*{friendName}" th:if="${#fields.hasErrors('friendName')}"></div>
                </div>
                <div class="col">
                    <label class="form-label text-white" for="friendUsername">Username</label>
                    <input class="form-control bg-secondary text-white border-info" id="friendUsername"
                           th:field="*{friendUsername}" type="text">
                    <div class="text-danger" th:errors="*{friendUsername}" th:if="${#fields.hasErrors('friendUsername')}"></div>
                </div>
                <div class="col">
                    <label class="form-label text-white" for="friendEmail">Emailadres</label>
                    <input class="form-control bg-secondary text-white border-info" id="friendEmail"
                           th:field="*{friendEmail}" type="text">
                    <div class="text-danger" th:errors="*{friendEmail}"
                         th:if="${#fields.hasErrors('friendEmail')}"></div>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col">
                    <label for="friendDob">Verjaardag</label>
                    <input class="form-control bg-secondary text-white border-info" id="friendDob" name="friendDob"
                           th:value="*{friendDob}" type="date">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col">
                    <label class="form-label text-white" for="friendPassword">Wachtwoord</label>
                    <input class="form-control bg-secondary text-white border-info" id="friendPassword"
                           name="password" placeholder="Password" required type="password">
                </div>
            </div>

            <input th:name="${_csrf.parameterName}" th:value="${_csrf.token}" type="hidden"/>

            <div class="d-flex gap-2 mt-3">
                <button class="btn btn-outline-info" type="submit">Opslaan</button>
                <a class="btn btn-outline-secondary" th:href="@{/friend-overview}">Annuleer</a>
            </div>
        </form>
    </div>

</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
