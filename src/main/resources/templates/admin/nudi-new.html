<!DOCTYPE html>
<html lang="en">
<head th:replace="~{fragments/header :: headerelement(pageTitle)}"></head>
<body class="details-page">
<div th:replace="~{fragments/header :: navbar}"></div>
<main class="container-fluid" th:object="${nudibranch}">
    <h2 class="text-center display-4 mb-4 text-info">Maak een nieuwe nudibranch aan</h2>
    <div class="row justify-content-center">
        <div class="col-12 bg-danger text-white mb-2"
             th:if="${#fields.hasAnyErrors()}">
            ERROR - data not saved
        </div>


        <form method="post" th:action="@{|/admin/nudi-new|}" th:object="${nudibranch}">
            <!-- Name and email -->
            <div class="row mb-3">

                <div class="col">
                    <label class="form-label text-white" for="commonName">Naam</label>
                    <input class="form-control bg-secondary text-white border-info" id="commonName"
                           th:field="*{commonName}" type="text">
                    <!--  voor de errormessage-->
                    <div class="text-danger"
                         th:errors="*{}"
                         th:if="${#fields.hasErrors('commonName')}"></div>
                </div>
                <div class="col">
                    <label class="form-label text-white" for="scientificName">Wetenschappelijke naam</label>
                    <input class="form-control bg-secondary text-white border-info" id="scientificName"
                           th:field="*{scientificName}" type="text">
                 <!--   voor de errormessage-->
                    <div class="text-danger"
                         th:errors="*{scientificName}"
                         th:if="${#fields.hasErrors('scientificName')}"></div>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col">
                    <label for="description">Beschrijving</label>
                    <input class="form-control bg-secondary text-white border-info" id="description" name="description"
                           th:value="*{description}" type="text">
                </div>
            </div>
            <div class="row mb-3">
                <div class="col">
                    <input type="radio" class="btn-check" name="options-outlined" id="nudiNonVenomous" autocomplete="off" th:field="*{venomous}" th:value="false">
                    <label class="btn btn-outline-success m-1" for="nudiNonVenomous">Niet Giftig</label>

                    <input type="radio" class="btn-check" name="options-outlined" id="nudiVenomous" autocomplete="off" th:field="*{venomous}" th:value="true">
                    <label class="btn btn-outline-danger m-1" for="nudiVenomous">Giftig</label>
                </div>
            </div>



            <!-- Save & Cancel -->
            <div class="d-flex gap-2 mt-3">
                <button class="btn btn-outline-info" type="submit">Opslaan</button>
                <a class="btn btn-outline-secondary" th:href="@{|/nudi-overview|}">Annuleer</a>
            </div>

        </form>
    </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
