<!DOCTYPE html>
<html lang="en">
<head th:replace="~{fragments/header :: headerelement(${pageTitle})}"></head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<main class="container-fluid overview-page">

    <!-- Page Title -->
    <h1>Nudis</h1>


    <!-- Buttons Row: Filter -->
    <div class="d-flex mb-3">
        <button class="btn btn-primary me-2" data-bs-target="#filterModal" data-bs-toggle="modal">
            Filter nudis
        </button>

        <div class="col text-start">
            <a class="btn btn-outline-primary" th:href="@{/admin/nudi-new}"
               sec:authorize="hasRole('ADMIN')">Maak een nieuwe nudibranch aan</a>
        </div>


    </div>

    <!-- Filter Modal -->
    <div aria-hidden="true" aria-labelledby="filterModalLabel" class="modal fade" data-bs-backdrop="static"
         data-bs-keyboard="false"
         id="filterModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

                <!-- Modal Header -->
                <div class="modal-header">
                    <h5 class="modal-title" id="filterModalLabel">Nudis Filter</h5>
                    <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
                </div>

                <!-- Modal Body -->
                <div class="modal-body">
                    <form method="get" th:action="@{/nudi-overview}">
                        <!-- Keyword -->
                        <div class="mb-3">
                            <label class="form-label" for="keyword">Zoek op keyword</label>
                            <input class="form-control" id="keyword" name="keyword" placeholder="Zoek op keyword..."
                                   th:value="${param.keyword}" type="text">
                        </div>
                        <!-- Common Name -->
                        <div class="mb-3">
                            <label class="form-label" for="commonName">Common Name</label>
                            <input class="form-control" id="commonName" name="commonName"
                                   placeholder="Filter op naam..."
                                   th:value="${param.commonName}" type="text">
                        </div>
                        <!-- Scientific Name -->
                        <div class="mb-3">
                            <label class="form-label" for="scientificName">Scientific Name</label>
                            <input class="form-control" id="scientificName" name="scientificName"
                                   placeholder="Filter op wetenschappelijke naam..." th:value="${param.scientificName}"
                                   type="text">
                        </div>
                        <!-- Venomous -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Filter op giftig</label>
                            <div class="form-check">
                                <input class="form-check-input" name="venomous" th:checked="${param.venomous == null}"
                                       type="radio"
                                       value="">
                                <label class="form-check-label">Alle</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" name="venomous" th:checked="${param.venomous == 'true'}"
                                       type="radio"
                                       value="true">
                                <label class="form-check-label">Enkel giftige</label>
                            </div>
                            <div class="form-check mb-3">
                                <input class="form-check-input" name="venomous"
                                       th:checked="${param.venomous == 'false'}" type="radio"
                                       value="false">
                                <label class="form-check-label">Enkel niet-giftige</label>
                            </div>
                        </div>

                        <!-- Submit -->
                        <button class="btn btn-primary float-end" type="submit">Filter</button>
                    </form>
                </div>

            </div>
        </div>
    </div>
    <!-- End Filter Modal -->

    <div class="col-12 mb-3" th:text="|${nudis.size()} nudis gevonden|"></div>


    <!-- Nudibranch Cards -->
    <div class="d-flex flex-wrap justify-content-center">
        <div class="card mb-3" style="width: 18rem;" th:each="nudi : ${nudis}">
            <div class="card-body">
                <h5 class="card-title" th:text="${nudi.commonName}"></h5>
                <p class="card-text" th:text="${nudi.scientificName}"></p>
                <img alt="Nudi image" class="img-thumbnail mb-2" style="height: 20rem; object-fit: contain;"
                     th:src="@{${nudi.imageUrl}}">
                <a class="btn btn-outline-info mt-2"
                   th:href="@{/nudi-details/{id}(id=${nudi.nudibranchId})}">Details</a>
            </div>
        </div>
    </div>
    <!-- Call to Action: Upload nudi -->
    <div class="text-center my-5">
        <p class="fs-5 mb-3">
            Ontbreekt er nog een nudi of heb je een nieuwe nudi gespot?
        </p>
        <a class="btn btn-primary btn-lg px-4"
           th:href="@{/upload}">
            Deel jouw nudi
        </a>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
