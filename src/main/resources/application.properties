spring.application.name=nudibranch
spring.datasource.url=jdbc:h2:mem:nudicentral
spring.datasource.username=sa
spring.datasource.password=${H2_DB_PASSWORD}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
#toon niet de default whitelabel page - maar custom error page
server.error.whitelabel.enabled=false

# Dit is voor de weergave in HTM
image-bucket-url=https://wpounbmsqxlkejhuquxj.supabase.co/storage/v1/object/public/nudibranch

# Dit is voor de upload (SDK)
supabase.s3.bucket-name=nudibranch
supabase.s3.endpoint=https://wpounbmsqxlkejhuquxj.supabase.co/storage/v1/s3
supabase.s3.region=eu-west-1
supabase.s3.access-key=${SUPABASE_S3_ACCESS_KEY}
supabase.s3.secret-key=${SUPABASE_S3_SECRET_KEY}

spring.profiles.active=local